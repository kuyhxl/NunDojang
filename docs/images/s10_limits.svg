<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic','Helvetica Neue',sans-serif"><rect width="1920" height="1080" fill="#ffffff"/><text x="80" y="104" font-size="54" font-weight="800" fill="#0f172a">한계 세 가지</text>
<text x="80" y="152" font-size="27" fill="#64748b">그냥 한계로 두지 않고, 어디로 갈지까지 말씀드리겠습니다</text>
<rect x="80" y="230" width="530" height="610" rx="22" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
<rect x="80" y="230" width="530" height="8" rx="4" fill="#0284c7"/>
<text x="114" y="300" font-size="36" font-weight="800" fill="#0284c7" opacity="0.5">1</text>
<text x="345.0" y="372" font-size="37" font-weight="800" fill="#0f172a" text-anchor="middle">안경</text>
<text x="114" y="444" font-size="27" font-weight="400" fill="#64748b" text-anchor="start">안경 쓰고는 한 번도</text>
<text x="114" y="484" font-size="27" font-weight="400" fill="#64748b" text-anchor="start">테스트해 보지 않았습니다.</text>
<text x="114" y="524" font-size="27" font-weight="400" fill="#64748b" text-anchor="start">반사가 홍채 검출을</text>
<text x="114" y="564" font-size="27" font-weight="400" fill="#64748b" text-anchor="start">방해할 수 있습니다.</text>
<line x1="114" y1="618" x2="576" y2="618" stroke="#bfdbfe" stroke-width="2"/>
<text x="114" y="668" font-size="25" font-weight="800" fill="#0284c7">개선 방향</text>
<text x="114" y="714" font-size="25" font-weight="400" fill="#0284c7" text-anchor="start">보정이 이미 자기 오차를 안다 →</text>
<text x="114" y="750" font-size="25" font-weight="400" fill="#0284c7" text-anchor="start">기준 미달이면 거부하는 관문</text>
<rect x="695" y="230" width="530" height="610" rx="22" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
<rect x="695" y="230" width="530" height="8" rx="4" fill="#b91c1c"/>
<text x="729" y="300" font-size="36" font-weight="800" fill="#b91c1c" opacity="0.5">2</text>
<text x="960.0" y="372" font-size="37" font-weight="800" fill="#0f172a" text-anchor="middle">윗부분만 읽어도 통과</text>
<text x="729" y="444" font-size="27" font-weight="400" fill="#64748b" text-anchor="start">제목과 첫 줄만 읽었는데</text>
<text x="729" y="484" font-size="27" font-weight="400" fill="#64748b" text-anchor="start">95.3%가 나왔습니다.</text>
<text x="729" y="524" font-size="27" font-weight="400" fill="#64748b" text-anchor="start">세로 오차가 줄 간격의 3배라</text>
<text x="729" y="564" font-size="27" font-weight="400" fill="#64748b" text-anchor="start">몇 번째 줄인지 모릅니다.</text>
<line x1="729" y1="618" x2="1191" y2="618" stroke="#fecaca" stroke-width="2"/>
<text x="729" y="668" font-size="25" font-weight="800" fill="#b91c1c">개선 방향</text>
<text x="729" y="714" font-size="25" font-weight="400" fill="#b91c1c" text-anchor="start">단기 속도 경고(완료) → 중기 아이폰</text>
<text x="729" y="750" font-size="25" font-weight="400" fill="#b91c1c" text-anchor="start">TrueDepth 적외선 → 장기 글·시선 결합</text>
<rect x="1310" y="230" width="530" height="610" rx="22" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="2"/>
<rect x="1310" y="230" width="530" height="8" rx="4" fill="#7c3aed"/>
<text x="1344" y="300" font-size="36" font-weight="800" fill="#7c3aed" opacity="0.5">3</text>
<text x="1575.0" y="372" font-size="37" font-weight="800" fill="#0f172a" text-anchor="middle">이해는 판별 못 함</text>
<text x="1344" y="444" font-size="27" font-weight="400" fill="#64748b" text-anchor="start">눈으로 읽은 건 압니다.</text>
<text x="1344" y="484" font-size="27" font-weight="400" fill="#64748b" text-anchor="start">이해했는지는 모릅니다.</text>
<text x="1344" y="524" font-size="27" font-weight="400" fill="#64748b" text-anchor="start">1000Hz 장비도 59.2% —</text>
<text x="1344" y="564" font-size="27" font-weight="400" fill="#64748b" text-anchor="start">글만 보면 58.7%입니다.</text>
<line x1="1344" y1="618" x2="1806" y2="618" stroke="#ddd6fe" stroke-width="2"/>
<text x="1344" y="668" font-size="25" font-weight="800" fill="#7c3aed">개선 방향</text>
<text x="1344" y="714" font-size="25" font-weight="400" fill="#7c3aed" text-anchor="start">이해 대신 읽기 모드를 가른다</text>
<text x="1344" y="750" font-size="25" font-weight="400" fill="#7c3aed" text-anchor="start">B가 공개 데이터로 65.5% (기준선 50%)</text>
<text x="960.0" y="920" font-size="34" font-weight="800" fill="#0f172a" text-anchor="middle">거부할 줄 아는 것이 틀린 답을 내는 것보다 낫습니다</text></svg>