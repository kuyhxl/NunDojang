<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic','Helvetica Neue',sans-serif"><rect width="1920" height="1080" fill="#ffffff"/><text x="80" y="104" font-size="54" font-weight="800" fill="#0f172a">근거</text>
<text x="80" y="152" font-size="27" fill="#64748b">저희가 잰 읽기 속도가 문헌이 말하는 읽기 속도와 맞습니다</text>
<rect x="80" y="250" width="820" height="440" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="490" y="330" font-size="30" fill="#64748b" text-anchor="middle">Brysbaert (2019) · 메타분석</text>
<text x="490" y="392" font-size="30" fill="#0f172a" text-anchor="middle">비문학 묵독 속도</text>
<text x="490" y="552" font-size="150" font-weight="800" fill="#7c3aed" text-anchor="middle">238</text>
<text x="490" y="620" font-size="32" fill="#64748b" text-anchor="middle">단어 / 분</text>
<rect x="1020" y="250" width="820" height="440" rx="22" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2"/>
<text x="1430" y="330" font-size="30" fill="#64748b" text-anchor="middle">눈도장 실측 · 성실하게 읽은 쪽 47개</text>
<text x="1430" y="392" font-size="30" fill="#0f172a" text-anchor="middle">분당 223 ~ 696자 중 최대값</text>
<text x="1430" y="552" font-size="150" font-weight="800" fill="#059669" text-anchor="middle">232</text>
<text x="1430" y="620" font-size="32" fill="#64748b" text-anchor="middle">어절 / 분</text>
<text x="1430" y="662" font-size="22" fill="#64748b" text-anchor="middle">696자 ÷ 3 (한글 평균 3자/어절)</text>
<text x="960" y="470" font-size="54" font-weight="800" fill="#64748b" text-anchor="middle">≈</text>
<rect x="80" y="730" width="1760" height="100" rx="18" fill="#0f172a"/>
<text x="960.0" y="795" font-size="40" font-weight="800" fill="#fff" text-anchor="middle">저희가 재고 있는 것이 진짜 읽기라는 뜻입니다</text>
<text x="80" y="912" font-size="29" fill="#0f172a"><tspan font-weight="800">Rayner 외 (2016)</tspan>  묵독 200~400 wpm. <tspan font-weight="800">훑기는 그 2~4배이고 이해도가 떨어진다</tspan> — 저희가 잡으려는 구간이 정확히 거기입니다.</text>
<text x="80" y="962" font-size="29" fill="#0f172a"><tspan font-weight="800">Shubi 외 (2024, EMNLP)</tspan>  1000Hz 장비로 이해도 예측 59.2% — 글만 보고 맞히는 예측 58.7%.</text></svg>