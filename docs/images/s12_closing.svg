<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic','Helvetica Neue',sans-serif"><rect width="1920" height="1080" fill="#0b1220"/><rect width="1920" height="1080" fill="#0b1220"/>
<text x="160" y="300" font-size="34" font-weight="800" fill="#f87171">증명하지 않는 것</text>
<text x="160" y="372" font-size="52" fill="#cbd5e1">이해했다.</text>
<line x1="160" y1="440" x2="1760" y2="440" stroke="#334155" stroke-width="2"/>
<text x="160" y="540" font-size="34" font-weight="800" fill="#4ade80">증명하는 것</text>
<text x="160" y="622" font-size="52" font-weight="800" fill="#ffffff">이 문서의 각 줄을 따라 읽는 눈 움직임이,</text>
<text x="160" y="694" font-size="52" font-weight="800" fill="#ffffff">그 줄을 읽을 만한 시간 동안 관찰되었다.</text>
<rect x="160" y="800" width="1600" height="110" rx="18" fill="#1e293b"/>
<text x="960.0" y="868" font-size="38" font-weight="800" fill="#7dd3fc" text-anchor="middle">그리고 그 한계를 저희가 직접 깨서 확인했습니다</text></svg>