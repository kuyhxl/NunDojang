<text x="280.0" y="518" font-size="37" font-weight="800" fill="#0f172a" text-anchor="middle">문서를 다시 그린다</text>
<text x="280.0" y="572" font-size="26" fill="#64748b" text-anchor="middle">같은 글자 크기</text>
<text x="280.0" y="608" font-size="26" fill="#64748b" text-anchor="middle">같은 단 폭 · 쪽당 12줄</text>
