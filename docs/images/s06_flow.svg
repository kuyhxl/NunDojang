<text x="740.0" y="518" font-size="37" font-weight="800" fill="#0f172a" text-anchor="middle">눈을 보정한다</text>
<text x="740.0" y="572" font-size="26" fill="#64748b" text-anchor="middle">27점 · 약 30초</text>
<text x="740.0" y="608" font-size="26" fill="#64748b" text-anchor="middle">눈 움직임 → 화면 좌표</text>
