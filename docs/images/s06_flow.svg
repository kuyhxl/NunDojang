<text x="1488" y="308" font-size="40" font-weight="800" fill="#d97706" opacity="0.45">4</text>
<text x="1660.0" y="518" font-size="37" font-weight="800" fill="#0f172a" text-anchor="middle">봉인한다</text>
<text x="1660.0" y="572" font-size="26" fill="#64748b" text-anchor="middle">쪽별 점수와 보정 품질을</text>
<text x="1660.0" y="608" font-size="26" fill="#64748b" text-anchor="middle">문서에 함께 박는다</text>
<line x1="1500" y1="650" x2="1820" y2="650" stroke="#fde68a" stroke-width="2"/>
<text x="1660.0" y="702" font-size="27" font-weight="700" fill="#d97706" text-anchor="middle">나중에 근거를 되짚는다</text>
<rect x="80" y="817" width="1760" height="130" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="118" y="871" font-size="30" fill="#0f172a"><tspan font-weight="800" fill="#059669">증명하는 것 </tspan>각 줄을 따라 읽는 눈 움직임이, 그 줄을 읽을 만한 시간 동안 관찰되었다.</text>
<text x="118" y="919" font-size="30" fill="#0f172a"><tspan font-weight="800" fill="#b91c1c">증명하지 않는 것 </tspan>이해. 그건 1000Hz 장비로도 글만 보고 맞히는 예측을 넘지 못한다.</text>
