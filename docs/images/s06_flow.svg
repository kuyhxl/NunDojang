<text x="1200.0" y="572" font-size="26" fill="#64748b" text-anchor="middle">줄바꿈을 세고</text>
<text x="1200.0" y="608" font-size="26" fill="#64748b" text-anchor="middle">진행 거리와 시간을 본다</text>
<line x1="1040" y1="650" x2="1360" y2="650" stroke="#a7f3d0" stroke-width="2"/>
<text x="1200.0" y="702" font-size="27" font-weight="700" fill="#059669" text-anchor="middle">이 줄을 따라 읽었는가</text>
