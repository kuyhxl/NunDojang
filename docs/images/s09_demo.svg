<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic','Helvetica Neue',sans-serif"><rect width="1920" height="1080" fill="#0b1220"/><rect width="1920" height="1080" fill="#0b1220"/>
<text x="960.0" y="300" font-size="150" font-weight="800" fill="#ffffff" text-anchor="middle">시연</text>
<circle cx="430" cy="426" r="34" fill="#1e293b" stroke="#475569" stroke-width="2"/>
<text x="430" y="438" font-size="34" font-weight="800" fill="#7dd3fc" text-anchor="middle">1</text>
<text x="510" y="416" font-size="42" font-weight="700" fill="#e2e8f0">문서 열기</text>
<text x="510" y="462" font-size="28" fill="#94a3b8">스캔 이미지 PDF를 글자 인식으로</text>
<circle cx="430" cy="566" r="34" fill="#1e293b" stroke="#475569" stroke-width="2"/>
<text x="430" y="578" font-size="34" font-weight="800" fill="#7dd3fc" text-anchor="middle">2</text>
<text x="510" y="556" font-size="42" font-weight="700" fill="#e2e8f0">성실하게 읽기</text>
<text x="510" y="602" font-size="28" fill="#94a3b8">줄마다 읽음 표식이 찬다</text>
<circle cx="430" cy="706" r="34" fill="#1e293b" stroke="#475569" stroke-width="2"/>
<text x="430" y="718" font-size="34" font-weight="800" fill="#7dd3fc" text-anchor="middle">3</text>
<text x="510" y="696" font-size="42" font-weight="700" fill="#e2e8f0">일부러 훑기</text>
<text x="510" y="742" font-size="28" fill="#94a3b8">경고가 뜬다 — 점수는 깎지 않는다</text>
<circle cx="430" cy="846" r="34" fill="#1e293b" stroke="#475569" stroke-width="2"/>
<text x="430" y="858" font-size="34" font-weight="800" fill="#7dd3fc" text-anchor="middle">4</text>
<text x="510" y="836" font-size="42" font-weight="700" fill="#e2e8f0">봉인 발급</text>
<text x="510" y="882" font-size="28" fill="#94a3b8">쪽별 점수와 보정 품질을 문서에</text></svg>