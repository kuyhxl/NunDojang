<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic','Helvetica Neue',sans-serif"><rect width="1920" height="1080" fill="#ffffff"/><text x="80" y="104" font-size="54" font-weight="800" fill="#b91c1c">가장 큰 한계 — 저희가 직접 깨 봤습니다</text>
<text x="80" y="152" font-size="27" fill="#64748b">일부러 훑어서 기록을 남기고, 우리 알고리즘으로 채점했습니다</text>
<rect x="80" y="230" width="880" height="430" rx="22" fill="#fef2f2" stroke="#fecaca" stroke-width="3"/>
<text x="520" y="310" font-size="32" fill="#64748b" text-anchor="middle">제목과 문단 첫 줄만 읽었더니</text>
<text x="520" y="486" font-size="170" font-weight="800" fill="#b91c1c" text-anchor="middle">95.3%</text>
<text x="520" y="562" font-size="34" font-weight="800" fill="#0f172a" text-anchor="middle">성실하게 읽은 기록 5개 중</text>
<text x="520" y="612" font-size="34" font-weight="800" fill="#0f172a" text-anchor="middle">4개보다 높습니다</text>
<rect x="1020" y="230" width="820" height="430" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="1060" y="300" font-size="30" font-weight="800" fill="#0f172a">왜 그런가 — 웹캠의 한계</text>
<text x="1060" y="364" font-size="28" font-weight="400" fill="#64748b" text-anchor="start">문단 첫 줄만 읽는 사람의 눈 움직임은</text>
<text x="1060" y="404" font-size="28" font-weight="400" fill="#64748b" text-anchor="start">진짜 읽기 움직임입니다.</text>
<rect x="1060" y="434" width="740" height="110" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="1430" y="478" font-size="29" fill="#0f172a" text-anchor="middle">보정 후에도 세로 오차 95~121px</text>
<text x="1430" y="520" font-size="29" font-weight="800" fill="#b91c1c" text-anchor="middle">= 줄 간격(40px)의 2.4~3.0배</text>
<text x="1060" y="596" font-size="28" font-weight="400" fill="#64748b" text-anchor="start">몇 번째 줄을 보는지 모릅니다.</text>
<text x="1060" y="636" font-size="28" font-weight="400" fill="#64748b" text-anchor="start">문턱 조정으로 될 문제가 아닙니다.</text>
<rect x="80" y="710" width="530" height="260" rx="18" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2"/>
<rect x="80" y="710" width="530" height="7" rx="3.5" fill="#059669"/>
<text x="110" y="778" font-size="29" font-weight="800" fill="#059669">단기 — 이미 넣음</text>
<text x="110" y="830" font-size="25" font-weight="400" fill="#64748b" text-anchor="start">속도·가로 폭 경고. 빠르게 쓸거나 글</text>
<text x="110" y="868" font-size="25" font-weight="400" fill="#64748b" text-anchor="start">밖을 보는 건 잡는다</text>
<rect x="695" y="710" width="530" height="260" rx="18" fill="#fffbeb" stroke="#fde68a" stroke-width="2"/>
<rect x="695" y="710" width="530" height="7" rx="3.5" fill="#d97706"/>
<text x="725" y="778" font-size="29" font-weight="800" fill="#d97706">중기 — 아이폰 TrueDepth</text>
<text x="725" y="830" font-size="25" font-weight="400" fill="#64748b" text-anchor="start">적외선으로 깊이를 재니 조명·안경에</text>
<text x="725" y="868" font-size="25" font-weight="400" fill="#64748b" text-anchor="start">강하다. 세로 정확도가 오르면 줄을 짚을</text>
<text x="725" y="906" font-size="25" font-weight="400" fill="#64748b" text-anchor="start">수 있다 (아직 가설)</text>
<rect x="1310" y="710" width="530" height="260" rx="18" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="2"/>
<rect x="1310" y="710" width="530" height="7" rx="3.5" fill="#7c3aed"/>
<text x="1340" y="778" font-size="29" font-weight="800" fill="#7c3aed">장기 — 글과 시선 결합</text>
<text x="1340" y="830" font-size="25" font-weight="400" fill="#64748b" text-anchor="start">어려운 문장에서 더 오래 머무는가</text></svg>