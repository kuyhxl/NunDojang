<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic','Helvetica Neue',sans-serif"><rect width="1920" height="1080" fill="#ffffff"/><text x="80" y="104" font-size="54" font-weight="800" fill="#0f172a">세 가지만 여쭤보겠습니다</text>
<text x="80" y="152" font-size="27" fill="#64748b">전부 이 안내문에 적혀 있던 내용입니다</text>
<rect x="80" y="240" width="530" height="540" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect x="80" y="240" width="530" height="8" rx="4" fill="#0284c7"/>
<text x="345.0" y="330" font-size="31" fill="#64748b" text-anchor="middle">접종 후 몇 분 동안</text>
<text x="345.0" y="374" font-size="31" fill="#64748b" text-anchor="middle">접종기관에 머물러야 할까요?</text>
<line x1="140" y1="430" x2="550" y2="430" stroke="#cbd5e1" stroke-width="2"/>
<text x="345.0" y="590" font-size="84" font-weight="800" fill="#0284c7" text-anchor="middle">15~30분</text>
<text x="345.0" y="700" font-size="24" fill="#64748b" text-anchor="middle">안내문에 적혀 있던 내용</text>
<rect x="695" y="240" width="530" height="540" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect x="695" y="240" width="530" height="8" rx="4" fill="#7c3aed"/>
<text x="960.0" y="330" font-size="31" fill="#64748b" text-anchor="middle">그 뒤로 몇 시간을</text>
<text x="960.0" y="374" font-size="31" fill="#64748b" text-anchor="middle">더 관찰해야 할까요?</text>
<line x1="755" y1="430" x2="1165" y2="430" stroke="#cbd5e1" stroke-width="2"/>
<text x="960.0" y="590" font-size="84" font-weight="800" fill="#7c3aed" text-anchor="middle">3시간</text>
<text x="960.0" y="700" font-size="24" fill="#64748b" text-anchor="middle">안내문에 적혀 있던 내용</text>
<rect x="1310" y="240" width="530" height="540" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect x="1310" y="240" width="530" height="8" rx="4" fill="#d97706"/>
<text x="1575.0" y="330" font-size="31" fill="#64748b" text-anchor="middle">이상반응이 의심되면</text>
<text x="1575.0" y="374" font-size="31" fill="#64748b" text-anchor="middle">어디에 전화할까요?</text>
<line x1="1370" y1="430" x2="1780" y2="430" stroke="#cbd5e1" stroke-width="2"/>
<text x="1575.0" y="590" font-size="84" font-weight="800" fill="#d97706" text-anchor="middle">1339</text>
<text x="1575.0" y="700" font-size="24" fill="#64748b" text-anchor="middle">안내문에 적혀 있던 내용</text>
<rect x="80" y="840" width="1760" height="150" rx="18" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
<text x="960.0" y="906" font-size="36" fill="#0f172a" text-anchor="middle">안전에 관한 내용이었습니다.</text>
<text x="960.0" y="958" font-size="36" font-weight="800" fill="#b91c1c" text-anchor="middle">그리고 우리는 전부 “읽었습니다”에 체크했습니다.</text></svg>