[project]
name = "nundojang"
version = "0.1.0"
description = "눈도장 — 웹캠 안구 신호 기반 PDF 정독 검증 + 봉인. 로컬 서버와 분석 환경."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.scripts]
nundojang = "server.app:main"

[dependency-groups]
analysis = [
  "pandas>=2.2",
  "numpy>=1.26",
  "matplotlib>=3.8",
  "scikit-learn>=1.4",
  "jupyter>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]
